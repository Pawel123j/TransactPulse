name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.4,<1.0"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  spark-tests:
    name: Spark transformation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # Spark 3.5 supports Java 8/11/17.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dev + Spark dependencies
        run: pip install -r requirements-dev.txt -r requirements-spark.txt
      # TP_REQUIRE_SPARK=1 turns a missing PySpark into a hard failure, so these
      # tests can never silently skip here (see tests/spark_support.py).
      - name: Run Spark tests
        env:
          TP_REQUIRE_SPARK: "1"
        run: |
          pytest -q -rs \
            tests/test_bronze_transform.py \
            tests/test_silver_transform.py \
            tests/test_gold_aggregates.py

  security:
    name: Security checks (bandit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install "bandit[toml]>=1.7,<2"
      - name: Bandit (Python SAST) — blocking
        run: bandit -c pyproject.toml -r analytics dashboard ingestion lakehouse orchestration streaming
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
      - name: Gitleaks (secret scanning) — blocking
        run: /tmp/gitleaks dir . --no-banner --redact

      # ---- Dependency CVE gate -------------------------------------------
      # pip-audit is the blocking dependency gate: it installs from PyPI (no
      # third-party action, no unverified image tag) and resolves every
      # requirements file in the repo against the Python advisory database.
      #
      # If an advisory with no released fix ever lands here, do NOT drop the
      # gate — add `--ignore-vuln <ID>` below with a one-line justification, so
      # the exception is explicit and reviewable.
      - name: Install pip-audit
        run: pip install "pip-audit>=2.7,<3"
      - name: pip-audit (dependency CVEs) — blocking
        run: |
          for req in requirements-dev.txt \
                     ingestion/requirements.txt \
                     lakehouse/requirements.txt \
                     streaming/requirements.txt \
                     dashboard/requirements.txt; do
            echo "::group::pip-audit $req"
            pip-audit -r "$req" --progress-spinner off
            echo "::endgroup::"
          done

      # Trivy is NOT wired up here, and that is a deliberate call rather than an
      # oversight. Two attempts failed for the same underlying reason:
      #
      #   1. `aquasecurity/trivy-action` pinned to a tag that did not resolve,
      #      failing at job set-up where continue-on-error cannot catch it.
      #   2. A pinned release tarball — the gitleaks pattern — 404'd, because
      #      the correct version/asset name cannot be verified from an
      #      environment whose egress policy blocks GitHub Releases for
      #      third-party repositories.
      #
      # A `continue-on-error` Trivy step is worse than no Trivy step: it reads
      # as coverage in the job name while scanning nothing. pip-audit above is
      # the real, blocking dependency gate.
      #
      # Adding Trivy takes one step from a machine with open network access —
      # the exact snippet is in HUMAN_ACTION_REQUIRED.md.

  docker-build:
    name: Validate Docker builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f infra/docker-compose.yml config -q
          docker compose -f orchestration/docker-compose.yml config -q
      - name: Build jobs image (Spark + Delta + ML)
        run: docker build -f streaming/Dockerfile -t transactpulse/streaming:ci .
      - name: Build dashboard image
        run: docker build -f dashboard/Dockerfile -t transactpulse/dashboard:ci .
