[project]
name = "transactpulse"
version = "1.0.0"
description = "Real-Time Big Data Lakehouse for financial transactions (portfolio project)."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PL"]
# PLC0415: lazy imports of optional heavy deps (pyspark/delta/confluent-kafka) are
# intentional so modules import without those packages installed.
ignore = ["PLR2004", "PLR0913", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.bandit]
# Scanned in CI: `bandit -c pyproject.toml -r analytics dashboard ingestion
# lakehouse orchestration streaming`. Tests are excluded (asserts are expected);
# every remaining finding is either fixed or annotated inline with `# nosec`
# plus the reason it is safe here. See SECURITY.md.
exclude_dirs = ["tests", ".venv", "venv"]
