# Airflow 3.3.2, local isolated development. Generate private settings first:
# python orchestration/init_local.py /absolute/new/settings-directory
# docker compose --env-file /absolute/new/settings-directory/airflow.env -f orchestration/docker-compose.yml up -d --build
name: transactpulse-airflow

x-airflow-common: &airflow-common
  image: transactpulse/airflow:3.3.2
  build:
    context: ..
    dockerfile: orchestration/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?generate private Airflow settings}@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?generate private Airflow settings}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/private/passwords.json
    TP_JOBS_IMAGE: transactpulse/streaming:latest
    TP_NETWORK: transactpulse
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - ${AIRFLOW_AUTH_PASSWORDS_FILE:?generate private Airflow settings}:/opt/airflow/private/passwords.json:ro
  depends_on:
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?generate private Airflow settings}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, airflow]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: db migrate
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # Socket access is still equivalent to host control: trusted local lab only.
    group_add:
      - "${DOCKER_SOCKET_GID:?set the local Docker socket group}"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - ${AIRFLOW_AUTH_PASSWORDS_FILE:?generate private Airflow settings}:/opt/airflow/private/passwords.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  airflow-db-data:
    name: tp-airflow-db-data
  airflow-logs:
    name: tp-airflow-logs
