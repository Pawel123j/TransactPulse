# TransactPulse — base infrastructure (Stage 3)
# Kafka (KRaft, no ZooKeeper) + Kafka UI + MinIO (S3) + bucket/topic init.
#
# Bring up:   docker compose -f infra/docker-compose.yml up -d
# Tear down:  docker compose -f infra/docker-compose.yml down         (keep volumes)
#             docker compose -f infra/docker-compose.yml down -v      (wipe volumes)
#
# Endpoints (host):
#   Kafka bootstrap ....... localhost:9092
#   Kafka UI .............. http://localhost:8080
#   MinIO S3 API .......... http://localhost:9000
#   MinIO console ......... http://localhost:9001  (login: ${MINIO_ROOT_USER})

name: transactpulse

services:
  # --------------------------------------------------------------------- #
  # Kafka broker in KRaft mode (combined broker + controller, single node) #
  # --------------------------------------------------------------------- #
  kafka:
    image: apache/kafka:3.8.1
    container_name: tp-kafka
    ports:
      # Host clients connect to localhost:9092 (EXTERNAL listener, see below).
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Three listeners: internal (containers), controller (KRaft), external (host).
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Single-node durability settings.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------- #
  # One-shot: create the transactions.raw topic (idempotent)               #
  # --------------------------------------------------------------------- #
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: tp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creating topic transactions.raw ...";
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic transactions.raw \
          --partitions ${TOPIC_PARTITIONS:-3} \
          --replication-factor 1;
        echo "Existing topics:";
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  # --------------------------------------------------------------------- #
  # Kafka UI (provectus) for inspecting topics/messages                    #
  # --------------------------------------------------------------------- #
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: tp-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: transactpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------- #
  # MinIO — S3-compatible object store backing the lakehouse               #
  # --------------------------------------------------------------------- #
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: tp-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------- #
  # One-shot: create the lakehouse bucket (idempotent)                     #
  # --------------------------------------------------------------------- #
  createbuckets:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: tp-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 \
          "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin123}";
        mc mb --ignore-existing local/${LAKEHOUSE_BUCKET:-lakehouse};
        echo "Buckets:";
        mc ls local
    restart: "no"

volumes:
  kafka-data:
    name: tp-kafka-data
  minio-data:
    name: tp-minio-data

networks:
  default:
    name: transactpulse
