# TransactPulse — full stack in one command.
#
#   docker compose up -d --build
#
# Brings up: Kafka (KRaft) + Kafka UI, MinIO, the bronze Spark stream, a synthetic
# transaction generator, Airflow (medallion_pipeline), and the Streamlit dashboard.
#
# Endpoints:
#   Dashboard ......... http://localhost:8501
#   Airflow ........... http://localhost:8088   (admin / admin)
#   Kafka UI .......... http://localhost:8080
#   MinIO console ..... http://localhost:9001    (minioadmin / minioadmin123)
#
# The infra and orchestration compose files are composed via `include`, so they can
# also be run standalone (see their READMEs). All data is synthetic.

name: transactpulse

include:
  - infra/docker-compose.yml
  - orchestration/docker-compose.yml

services:
  # Continuously produce synthetic transactions into Kafka.
  generator:
    image: transactpulse/streaming:latest
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: tp-generator
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["python3"]
    command:
      - "-m"
      - "ingestion"
      - "--rate"
      - "${GENERATOR_RATE:-20}"
      - "--bootstrap-servers"
      - "kafka:9092"
      - "--topic"
      - "transactions.raw"
    restart: unless-stopped

  # Streamlit analytics UI over the gold layer.
  dashboard:
    image: transactpulse/dashboard:latest
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: tp-dashboard
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      REPORTS_DIR: "/reports"
    volumes:
      - tp-reports:/reports
    restart: unless-stopped

volumes:
  tp-reports:
    name: tp-reports
